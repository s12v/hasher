name: Release

# Push a tag like v1.6.0 (matching "version" in manifest.json) to build the
# store package and attach it to a GitHub Release.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check that the tag matches manifest.json
        run: |
          version=$(node -p "require('./manifest.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match manifest version ${version}" >&2
            exit 1
          fi
      - run: npm run test:ci
      - run: npm run build
      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/hasher-*.zip --title "${GITHUB_REF_NAME}" --generate-notes
